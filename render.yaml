services:
  # Backend API and Workers
  - type: web
    name: kairos-backend
    runtime: node
    rootDir: kairosBack
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run db:migrate && node dist/main
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: kairos-db
          property: connectionString
      - key: VALKEY_URL
        fromService:
          type: redis
          name: kairos-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: OUTBOX_POLL_INTERVAL_MS
        value: 5000

  # Frontend Application
  - type: web
    name: kairos-frontend
    runtime: node
    rootDir: kairosFront
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_KAIROS_API_URL
        fromService:
          type: web
          name: kairos-backend
          property: url

databases:
  - name: kairos-db
    databaseName: kairos
    user: kairos
    plan: starter
    postgresMajorVersion: 17

# Redis (Render's Redis is compatible with Valkey)
# Note: Render Redis doesn't have a specific Valkey type, we use redis.
redis:
  - name: kairos-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: [] # Only allow internal connections
