services:
  # Monolith: Backend + Frontend + Workers
  - type: web
    name: kairos-app
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: kairos-db
          property: connectionString
      - key: VALKEY_URL
        fromService:
          type: keyvalue
          name: kairos-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: OUTBOX_POLL_INTERVAL_MS
        value: 5000
      - key: NEXT_PUBLIC_KAIROS_API_URL
        value: "/kairos-api"

  # Redis (Render Key Value / Valkey 8)
  - type: keyvalue
    name: kairos-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: kairos-db
    databaseName: kairos
    user: kairos
    plan: starter
    postgresMajorVersion: 17
